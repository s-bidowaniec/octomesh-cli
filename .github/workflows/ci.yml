name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    name: Rust Check & Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run Rust unit & failover integration tests
        run: cargo test --workspace

  python:
    name: Python Lint & Adapter Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.11"
      - name: Install adapter dev dependencies
        working-directory: adapters
        run: uv sync --dev
      - name: Run Ruff linter
        working-directory: adapters
        run: uv run ruff check .
      - name: Run Pytest suite
        working-directory: adapters
        run: uv run pytest -v

  e2e-mock:
    name: End-to-end mesh harness (mock-only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build octo binary
        run: cargo build --workspace
      - name: Run mock end-to-end mesh harness
        run: bash scripts/e2e_mesh.sh --mock-only
